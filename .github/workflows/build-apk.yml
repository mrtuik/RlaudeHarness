name: Build Rlaude Harness APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, accept licenses and install components
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_ROOT/cmdline-tools/latest/bin:$ANDROID_ROOT/platform-tools:$PATH"

          if [ -x "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager > /dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$ANDROID_ROOT/tools/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      # A plain zip / re-uploaded repo has empty submodule folders. Fetch the native sources if missing.
      # NOTE: this takes the latest termux sources. If the native build fails on a PRoot source file,
      # pin these clones to the commit used by the upstream Mobile-Harness repo.
      - name: Fetch native sources (PRoot, libandroid-shmem) if missing
        run: |
          if [ ! -f third_party/proot/src/cli/proot.c ]; then
            rm -rf third_party/proot
            git clone --depth 1 https://github.com/termux/proot.git third_party/proot
          fi
          if [ ! -f third_party/libandroid-shmem/shmem.c ]; then
            rm -rf third_party/libandroid-shmem
            git clone --depth 1 https://github.com/termux/libandroid-shmem.git third_party/libandroid-shmem
          fi

      # The Antigravity CLI is embedded in the APK, so the bundle must exist before Gradle runs.
      - name: Build Antigravity bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          bash scripts/runtime-bundles/build-agy-from-official.sh
          python3 scripts/ci/patch-agy-checksum.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build online debug APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleOnlineDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rlaude-harness-online-debug
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
